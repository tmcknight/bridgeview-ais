<!doctype html>
<html><head><meta charset="utf-8">
<!-- App Store header and search results asset (universal 16:9, 5244x2950). Render:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=5244,2950 --screenshot=universal-16x9.png "file://$PWD/universal.html" -->
<style>
  html,body{margin:0;width:5244px;height:2950px;overflow:hidden}
  body{
    background:
      radial-gradient(ellipse 60% 70% at 72% 30%, #1A6A9A 0%, rgba(26,106,154,0) 70%),
      linear-gradient(180deg,#0B2A47 0%,#0A3C61 55%,#07121D 100%);
    font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;color:#fff;position:relative;
  }
  /* The photo, faded into the blues: kept faint so the words and phone lead */
  .photo{position:absolute;top:0;bottom:0;left:2700px;right:0;
    background:url(bridge-photo.jpg) -560px center/auto 100% no-repeat;
    filter:grayscale(.3) blur(3px) brightness(.95);opacity:.42;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 35%);mask-image:linear-gradient(90deg,transparent 0%,#000 35%)}
  .tint{position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(7,24,41,.92) 0%,rgba(10,60,97,.62) 42%,rgba(10,60,97,.25) 70%,rgba(7,18,29,.35) 100%),
      linear-gradient(180deg,rgba(11,42,71,.35) 0%,rgba(7,18,29,.7) 100%)}
  .copy{position:absolute;left:420px;top:880px;width:1900px}
  .eyebrow{font-size:96px;font-weight:700;letter-spacing:.18em;color:#FF9A52;text-transform:uppercase;margin-bottom:60px}
  h1{margin:0;font-size:250px;line-height:1.0;font-weight:900;font-stretch:expanded;font-variation-settings:"wdth" 150;letter-spacing:-.01em}
  .icon{width:300px;height:300px;border-radius:66px;margin-bottom:90px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .phone{position:absolute;left:2640px;top:190px;width:1180px;height:2564px;border-radius:190px;background:#111;padding:34px;box-sizing:border-box;
    box-shadow:0 80px 200px rgba(0,0,0,.55),0 0 0 6px #2b3540}
  .phone img{width:100%;height:100%;border-radius:158px;display:block}
</style></head><body>
<div class="photo"></div>
<div class="tint"></div>
<div class="copy">
  <img class="icon" src="../../Brand/icon.png">
  <div class="eyebrow">Blue Water Bridge</div>
  <h1>Never miss<br>a laker</h1>
</div>
<div class="phone"><img src="../screenshots/1-coming-up.png"></div>
</body></html>
