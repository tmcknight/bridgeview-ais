# Room for two host names in one map key ($home_page below); set before any map
map_hash_bucket_size 256;

# Served through Cloudflare, every request comes from Cloudflare's side; the viewer's own
# address is in CF-Connecting-IP. The ws-server rate-limits per address, so pass that on.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# With MAP_HOST set (say map.example.com), the map is the home page on that host
# only, and every other host shows the app's page (app.html) at /. Unset, the map
# is the home page everywhere. (Filled in from the environment when the container
# starts: this file is an nginx template.)
map "${MAP_HOST}|$host" $home_page {
    "~^\|"                    /index.html;
    "${MAP_HOST}|${MAP_HOST}" /index.html;
    default                   /app.html;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Access can open /api/ to everyone while gating the rest, but it
    # matches the path before nginx decodes it: /api/..%2Fws would pass as /api/
    # and land on /ws here. No real URL has an encoded slash, backslash or dot, or
    # a dot segment, in its path, so refuse them.
    if ($request_uri ~* "^[^?]*(%2f|%5c|%2e|/\.\.?(/|\?|$))") {
        return 400;
    }

    location = / {
        try_files $home_page =404;
    }

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The admin page (password-protected by its API; not linked from anywhere)
    location = /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files /admin.html =404;
    }
    location = /admin.html {
        return 404;
    }

    # Proxy WebSocket connections to the backend server
    location /ws {
        proxy_pass http://ws-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # The iOS app's API (see ios/API.md)
    location /api/ {
        # Room for photos uploaded on the admin page
        client_max_body_size 11m;
        proxy_pass http://ws-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
