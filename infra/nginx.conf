# Served through Cloudflare, every request comes from Cloudflare's side; the viewer's own
# address is in CF-Connecting-IP. The ws-server rate-limits per address, so pass that on.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Access can open /api/ to everyone while gating the rest, but it
    # matches the path before nginx decodes it: /api/..%2Fws would pass as /api/
    # and land on /ws here. No real URL has an encoded slash, backslash or dot, or
    # a dot segment, in its path, so refuse them.
    if ($request_uri ~* "^[^?]*(%2f|%5c|%2e|/\.\.?(/|\?|$))") {
        return 400;
    }

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The admin page (password-protected by its API; not linked from anywhere)
    location = /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files /admin.html =404;
    }
    location = /admin.html {
        return 404;
    }

    # Proxy WebSocket connections to the backend server
    location /ws {
        proxy_pass http://ws-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # The plain pages (about, support, privacy, terms) and what they load, also
    # under /api/pages/: Cloudflare Access leaves /api/ open while gating the rest,
    # so the iOS app links here and the pages open without an Access login. They
    # load their stylesheet and icons by relative path, so those resolve here too.
    location ~ ^/api/pages/(about|support|privacy|terms)\.html$ {
        alias /usr/share/nginx/html/$1.html;
        default_type text/html;
    }
    location ~ ^/api/pages/(pages\.css|favicon\.png|icon-192\.png)$ {
        alias /usr/share/nginx/html/$1;
    }

    # The iOS app's API (see ios/API.md)
    location /api/ {
        # Room for photos uploaded on the admin page
        client_max_body_size 11m;
        proxy_pass http://ws-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
