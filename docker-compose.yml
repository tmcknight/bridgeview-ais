services:
  ws-server:
    build:
      dockerfile: infra/Dockerfile
      target: ws-server
    environment:
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY}
      - PORT=3001
      - WS_AUTH_TOKEN=${WS_AUTH_TOKEN:-}
      - TRUST_PROXY=true
      - MAX_CONNECTIONS_PER_IP=${MAX_CONNECTIONS_PER_IP:-20}
      - AIS_SOURCES=${AIS_SOURCES:-aisstream,local}
      - AISHUB_API_KEY=${AISHUB_API_KEY:-}
      - LOCAL_AIS_HOST=${LOCAL_AIS_HOST:-host.docker.internal}
      - LOCAL_AIS_PORT=${LOCAL_AIS_PORT:-5012}
      - LOCAL_AIS_WEB_URL=${LOCAL_AIS_WEB_URL:-}
      - VESSEL_INFO_LOOKUP=${VESSEL_INFO_LOOKUP:-true}
      - VESSEL_REGISTRY=${VESSEL_REGISTRY:-true}
      - USCG_LOOKUP=${USCG_LOOKUP:-true}
      - AIRCRAFT_TRACKING=${AIRCRAFT_TRACKING:-true}
      - ADSB_URL=${ADSB_URL:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_BUNDLE_ID=${APNS_BUNDLE_ID:-}
      - APNS_KEY=${APNS_KEY:-}
      - FCM_SERVICE_ACCOUNT=${FCM_SERVICE_ACCOUNT:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - PHOTOS_PUBLIC_URL=${PHOTOS_PUBLIC_URL:-}
      - NODE_ENV=production
    volumes:
      - ship-log:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  vessel-notifier:
    build:
      dockerfile: infra/Dockerfile
      target: vessel-notifier
    environment:
      - NTFY_TOPIC=${NTFY_TOPIC-bridgeview-ais}
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WATCH_POINTS=${WATCH_POINTS:-}
      - VESSEL_INFO_LOOKUP=${VESSEL_INFO_LOOKUP:-true}
      - WS_PROXY_URL=ws://ws-server:3001
      - WS_AUTH_TOKEN=${WS_AUTH_TOKEN:-}
    depends_on:
      - ws-server
    restart: unless-stopped

  # Named after the app so the name stays unique on a Docker network shared with other stacks
  bridgeview-ais-frontend:
    build:
      dockerfile: infra/Dockerfile
      target: frontend
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:80"
    depends_on:
      - ws-server
    restart: unless-stopped

volumes:
  ship-log:
