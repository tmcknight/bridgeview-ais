name: iOS release

# iOS releases are GitHub releases tagged ios-vX.Y.Z (ios/README.md). Publishing one builds the
# app from that tag and ships it to TestFlight with the release notes as "What to Test", then
# adds it to the TestFlight groups in the IOS_BETA_GROUP variable (if set; comma-separated). Merging PRs ships
# nothing to the App Store, so app changes build up until someone cuts a release.
#
# Run it by hand (Actions → iOS release → Run workflow) for a dry run: build and sign, no upload.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, like 1.1.0
        required: true
      dry_run:
        description: Build and sign only, don't upload
        type: boolean
        default: true
      notes:
        description: What to Test (only used when uploading)
        default: Dry run.

# One release at a time, so two can never take the same build number
concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'ios-v')
    runs-on: macos-26
    # The signing secrets live in this environment, which only main and ios-v* tags may deploy to and which needs a
    # reviewer's approval (Settings → Environments → app-release). Repository secrets would reach any branch's workflow.
    environment: app-release
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release from main only
        # A signed build comes only from reviewed code
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$(git rev-parse --short HEAD) is not on main: release (or dry run) from main only"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: brew install xcodegen
      - name: App settings
        # The bundle ID, team and server live in repository variables, not in the repo (ios/README.md)
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          API_URL: ${{ vars.IOS_API_URL }}
        run: |
          test -n "$BUNDLE_ID" && test -n "$TEAM_ID" && test -n "$API_URL" \
            || { echo "::error::Set the IOS_BUNDLE_ID, IOS_TEAM_ID and IOS_API_URL variables (ios/README.md)."; exit 1; }
          # xcconfig reads // as a comment, hence $()
          {
            echo "BRIDGEVIEW_BUNDLE_ID = $BUNDLE_ID"
            echo "DEVELOPMENT_TEAM = $TEAM_ID"
            echo "BRIDGEVIEW_API_URL = ${API_URL/:\/\//:/\$()/}"
          } > ios/Config/Local.xcconfig
          cat ios/Config/Local.xcconfig
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "::error::Set the ASC_KEY_P8 secret (ios/README.md)."; exit 1; }
          # runner.temp only exists inside steps, so the path is set here for the rest
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Signing certificate and profiles
        # The CI Apple Distribution certificate and the App Store profiles for the app and the widget
        # (ios/README.md), in a keychain of its own that's deleted at the end. Signing with fixed files
        # means Xcode never creates certificates in the account.
        env:
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          APP_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
          WIDGETS_PROFILE: ${{ secrets.IOS_WIDGETS_PROFILE }}
        run: |
          test -n "$P12" && test -n "$APP_PROFILE" && test -n "$WIDGETS_PROFILE" \
            || { echo "::error::Set IOS_DIST_P12, IOS_DIST_P12_PASSWORD, IOS_APPSTORE_PROFILE and IOS_WIDGETS_PROFILE (ios/README.md)."; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          # Xcode looks in the first folder; older tools in the second
          install_profile() {
            local file="$RUNNER_TEMP/$1.mobileprovision" plist uuid name
            printf '%s' "$2" | base64 --decode > "$file"
            plist=$(security cms -D -i "$file")
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$plist")
            for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
              mkdir -p "$dir" && cp "$file" "$dir/$uuid.mobileprovision"
            done
            rm "$file"
            echo "$3=$name" >> "$GITHUB_ENV"
            echo "Signing $1 with \"$name\" ($uuid)."
          }
          install_profile app "$APP_PROFILE" APP_PROFILE_NAME
          install_profile widgets "$WIDGETS_PROFILE" WIDGETS_PROFILE_NAME
      - name: Release notes
        # Through env, never pasted into the script, so notes can't run as shell
        env:
          NOTES: ${{ github.event.release.body || inputs.notes }}
        run: printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
      - name: Build and ship
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
          GROUP: ${{ vars.IOS_BETA_GROUP }}
        run: |
          args=(--version "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            --app-profile "$APP_PROFILE_NAME" --widgets-profile "$WIDGETS_PROFILE_NAME")
          [ -z "$GROUP" ] || args+=(--group "$GROUP")
          [ -z "$DRY_RUN" ] || args+=(--dry-run)
          node ios/scripts/testflight.js "${args[@]}"
      - name: Forget the keys
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH" ios/Config/Local.xcconfig
          [ -z "$KEYCHAIN" ] || security delete-keychain "$KEYCHAIN"
