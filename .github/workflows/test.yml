name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run tsc -- --noEmit

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Install vessel-notifier dependencies
        run: npm ci
        working-directory: services/vessel-notifier

      - name: Vessel notifier type check
        run: npx tsc --noEmit
        working-directory: services/vessel-notifier

      - name: Vessel notifier tests
        run: npm run test:coverage
        working-directory: services/vessel-notifier

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build images
        run: |
          docker build -f infra/Dockerfile --target ws-server -t bridgeview-ws-server .
          docker build -f infra/Dockerfile --target frontend -t bridgeview-frontend .
          docker build -f infra/Dockerfile --target vessel-notifier -t bridgeview-vessel-notifier .

      # Starts the server with no API keys and checks it answers, so a module
      # missing from the image fails here instead of crash-looping on deploy
      - name: Smoke test ws-server
        run: |
          docker run -d --name ws-server -p 3001:3001 \
            -e AIS_SOURCES=local -e VESSEL_INFO_LOOKUP=false -e VESSEL_REGISTRY=false \
            -e USCG_LOOKUP=false -e AIRCRAFT_TRACKING=false \
            bridgeview-ws-server
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/bridge > /dev/null; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' ws-server)" != "true" ]; then break; fi
            sleep 1
          done
          docker logs ws-server
          exit 1
